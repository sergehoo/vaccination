{% load static %}
<!DOCTYPE html>
<html lang="fr" x-data="vaccinationApp()" x-bind:class="darkMode ? 'dark' : ''">
<head>
    <meta charset="UTF-8">
    <title>Plateforme Vaccination CI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ivoireBlue: '#1A57A1',
                        ivoireGreen: '#18A999',
                        ivoireOrange: '#F59E0B',
                        ivoireNight: '#020617',
                    },
                    boxShadow: {
                        soft: '0 18px 45px rgba(15,23,42,0.24)',
                    },
                    borderRadius: {
                        '3xl': '1.75rem',
                    }
                }
            }
        }
    </script>

    <!-- Alpine state (avant Alpine.js) -->
    <script>
        window.vaccinationApp = function () {
            return {
                role: 'admin',
                darkMode: false,
                notifications: [
                    {
                        id: 1,
                        type: 'alert',
                        title: 'Stock critique',
                        message: 'Penta 3 en rupture dans 3 centres',
                        time: '10 min',
                        read: false
                    },
                    {
                        id: 2,
                        type: 'info',
                        title: 'Nouvelle campagne',
                        message: 'Lancement vaccination grippe saisonnière',
                        time: '1h',
                        read: true
                    },
                    {
                        id: 3,
                        type: 'success',
                        title: 'Synchro réussie',
                        message: 'DHIS2 - Région Abidjan 1',
                        time: '2h',
                        read: true
                    }
                ],
                unreadNotifications: 1,
                currentRegion: 'Toutes les régions',
                regions: ['Toutes les régions', 'Abidjan 1', 'Abidjan 2', 'Gbêkê', 'Tonkpi', 'San-Pédro'],
                currentVaccine: 'Tous les vaccins',
                vaccines: ['Tous les vaccins', 'COVID-19', 'PEV Routine', 'Rougeole-Rubéole', 'Fièvre Jaune'],
                init() {
                    const savedTheme = localStorage.getItem('vaccination_theme');
                    if (savedTheme === 'dark') {
                        this.darkMode = true;
                    }
                },
                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('vaccination_theme', this.darkMode ? 'dark' : 'light');
                },
                setRole(r) {
                    this.role = r;
                },
                markNotificationAsRead(id) {
                    const notification = this.notifications.find(n => n.id === id);
                    if (notification && !notification.read) {
                        notification.read = true;
                        this.unreadNotifications--;
                    }
                },
                markAllAsRead() {
                    this.notifications.forEach(n => {
                        if (!n.read) {
                            n.read = true;
                            this.unreadNotifications--;
                        }
                    });
                },
                openModal(modalType) {
                    this.activeModal = modalType;
                },
                closeModal() {
                    this.activeModal = null;
                }
            }
        }
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        /* Scrollbar custom */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            border-radius: 9999px;
            background: rgba(156, 163, 175, 0.5);
        }

        .dark ::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.5);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 5px rgba(24, 169, 153, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(24, 169, 153, 0.6);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        .pulse-glow {
            animation: pulse-glow 2s infinite;
        }

        /* Custom gradients */
        .gradient-primary {
            background: linear-gradient(135deg, #1d5501 0%, #18A999 100%);
        }

        .gradient-secondary {
            background: linear-gradient(135deg, #18A999 0%, #F59E0B 100%);
        }

        /* Variation plus douce (pour cartes, blocs d'info) */
        .gradient-primary-soft {
            background: linear-gradient(135deg, rgba(29, 85, 1, 0.15) 0%, rgba(24, 169, 153, 0.25) 100%);
        }

        /* Version "dark" (header, topbar, footer) */
        .gradient-primary-dark {
            background: linear-gradient(135deg, #020617 0%, #1d5501 50%, #18A999 100%);
        }

        /* NOUVEAU: Version light pour fonds très légers */
        .gradient-primary-ultralight {
            background: linear-gradient(135deg, rgba(29, 85, 1, 0.05) 0%, rgba(24, 169, 153, 0.08) 100%);
        }

        /* Accent "info" (stats, badges info) */
        .gradient-info {
            background: linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%);
        }

        /* Accent "info" soft */
        .gradient-info-soft {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15) 0%, rgba(34, 211, 238, 0.25) 100%);
        }

        /* Accent "warning" (stocks bas, alertes modérées) */
        .gradient-warning {
            background: linear-gradient(135deg, #F59E0B 0%, #f97316 50%, #fed7aa 100%);
        }

        /* Accent "warning" soft */
        .gradient-warning-soft {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(249, 115, 22, 0.25) 100%);
        }

        /* Accent "danger" (pharmacovigilance, incidents) */
        .gradient-danger {
            background: linear-gradient(135deg, #dc2626 0%, #f97373 50%, #fee2e2 100%);
        }

        /* Accent "danger" soft */
        .gradient-danger-soft {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.15) 0%, rgba(249, 115, 115, 0.25) 100%);
        }

        /* Accent "success" (couverture OK, synchro DHIS2 OK) */
        .gradient-success {
            background: linear-gradient(135deg, #16a34a 0%, #22c55e 50%, #bbf7d0 100%);
        }

        /* Accent "success" soft */
        .gradient-success-soft {
            background: linear-gradient(135deg, rgba(22, 163, 74, 0.15) 0%, rgba(34, 197, 94, 0.25) 100%);
        }

        /* NOUVEAU: Accent "purple" (fonctionnalités premium, admin) */
        .gradient-purple {
            background: linear-gradient(135deg, #8b5cf6 0%, #c084fc 50%, #e9d5ff 100%);
        }

        .gradient-purple-soft {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(192, 132, 252, 0.25) 100%);
        }

        /* NOUVEAU: Accent "pink" (santé féminine, pédiatrie) */
        .gradient-pink {
            background: linear-gradient(135deg, #ec4899 0%, #f472b6 50%, #fbcfe8 100%);
        }

        .gradient-pink-soft {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.15) 0%, rgba(244, 114, 182, 0.25) 100%);
        }

        /* NOUVEAU: Accent "indigo" (données, analytics) */
        .gradient-indigo {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #a5b4fc 100%);
        }

        .gradient-indigo-soft {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.15) 0%, rgba(99, 102, 241, 0.25) 100%);
        }

        /* NOUVEAU: Accent "emerald" (écologie, durabilité) */
        .gradient-emerald {
            background: linear-gradient(135deg, #10b981 0%, #34d399 50%, #a7f3d0 100%);
        }

        .gradient-emerald-soft {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(52, 211, 153, 0.25) 100%);
        }

        /* NOUVEAU: Accent "orange" (urgences, priorités) */
        .gradient-orange {
            background: linear-gradient(135deg, #f97316 0%, #fb923c 50%, #fed7aa 100%);
        }

        .gradient-orange-soft {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.15) 0%, rgba(251, 146, 60, 0.25) 100%);
        }

        /* NOUVEAU: Accent "cyan" (technologie, innovation) */
        .gradient-cyan {
            background: linear-gradient(135deg, #06b6d4 0%, #22d3ee 50%, #a5f3fc 100%);
        }

        .gradient-cyan-soft {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.15) 0%, rgba(34, 211, 238, 0.25) 100%);
        }

        /* NOUVEAU: Accent "rose" (sensibilisation, campagnes) */
        .gradient-rose {
            background: linear-gradient(135deg, #f43f5e 0%, #fb7185 50%, #fecdd3 100%);
        }

        .gradient-rose-soft {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.15) 0%, rgba(251, 113, 133, 0.25) 100%);
        }

        /* NOUVEAU: Accent "lime" (croissance, progrès) */
        .gradient-lime {
            background: linear-gradient(135deg, #84cc16 0%, #a3e635 50%, #d9f99d 100%);
        }

        .gradient-lime-soft {
            background: linear-gradient(135deg, rgba(132, 204, 22, 0.15) 0%, rgba(163, 230, 53, 0.25) 100%);
        }

        /* NOUVEAU: Accent "violet" (spécialités, expertises) */
        .gradient-violet {
            background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 50%, #ddd6fe 100%);
        }

        .gradient-violet-soft {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.15) 0%, rgba(139, 92, 246, 0.25) 100%);
        }

        /* NOUVEAU: Accent "amber" (attention, notifications) */
        .gradient-amber {
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 50%, #fde68a 100%);
        }

        .gradient-amber-soft {
            background: linear-gradient(135deg, rgba(217, 119, 6, 0.15) 0%, rgba(245, 158, 11, 0.25) 100%);
        }

        /* NOUVEAU: Accent "teal" (santé mentale, bien-être) */
        .gradient-teal {
            background: linear-gradient(135deg, #0d9488 0%, #14b8a6 50%, #99f6e4 100%);
        }

        .gradient-teal-soft {
            background: linear-gradient(135deg, rgba(13, 148, 136, 0.15) 0%, rgba(20, 184, 166, 0.25) 100%);
        }

        /* Fond neutre premium (cartes dashboard) */
        .gradient-surface {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 50%, #e2e8f0 100%);
        }

        /* Version dark pour les surfaces en mode sombre */
        .dark .gradient-surface {
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #020617 100%);
        }

        /* NOUVEAU: Surface avec accent primaire subtil */
        .gradient-surface-primary {
            background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 50%, #ecfdf5 100%);
        }

        .dark .gradient-surface-primary {
            background: linear-gradient(135deg, #020617 0%, #052e16 50%, #022c22 100%);
        }

        /* NOUVEAU: Surface avec accent médical */
        .gradient-surface-medical {
            background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 50%, #e0f2fe 100%);
        }

        .dark .gradient-surface-medical {
            background: linear-gradient(135deg, #020617 0%, #082f49 50%, #0c4a6e 100%);
        }

        /* Halo / highlight (pill, badges de statut) */
        .gradient-pill {
            background: radial-gradient(circle at top left, #18A999 0%, transparent 60%),
            radial-gradient(circle at bottom right, #F59E0B 0%, transparent 60%);
        }

        /* NOUVEAU: Variations de halo */
        .gradient-pill-info {
            background: radial-gradient(circle at top left, #0ea5e9 0%, transparent 60%),
            radial-gradient(circle at bottom right, #22d3ee 0%, transparent 60%);
        }

        .gradient-pill-success {
            background: radial-gradient(circle at top left, #16a34a 0%, transparent 60%),
            radial-gradient(circle at bottom right, #22c55e 0%, transparent 60%);
        }

        .gradient-pill-warning {
            background: radial-gradient(circle at top left, #f59e0b 0%, transparent 60%),
            radial-gradient(circle at bottom right, #f97316 0%, transparent 60%);
        }

        .gradient-pill-danger {
            background: radial-gradient(circle at top left, #dc2626 0%, transparent 60%),
            radial-gradient(circle at bottom right, #ef4444 0%, transparent 60%);
        }

        /* Map placeholder styling */
        .map-placeholder {
            background: radial-gradient(circle at 20% 30%, rgba(24, 169, 153, 0.1) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.1) 0%, transparent 50%),
            linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }

        .dark .map-placeholder {
            background: radial-gradient(circle at 20% 30%, rgba(24, 169, 153, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.15) 0%, transparent 50%),
            linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        /* NOUVEAU: Variations de placeholder */
        .map-placeholder-medical {
            background: radial-gradient(circle at 20% 30%, rgba(14, 165, 233, 0.1) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(34, 211, 238, 0.1) 0%, transparent 50%),
            linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        }

        .map-placeholder-success {
            background: radial-gradient(circle at 20% 30%, rgba(34, 197, 94, 0.1) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(132, 204, 22, 0.1) 0%, transparent 50%),
            linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        }

        /* NOUVEAU: Text gradients */
        .text-gradient-primary {
            background: linear-gradient(135deg, #1d5501 0%, #18A999 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .text-gradient-secondary {
            background: linear-gradient(135deg, #18A999 0%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .text-gradient-info {
            background: linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .text-gradient-success {
            background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* NOUVEAU: Border gradients */
        .border-gradient-primary {
            border: 2px solid transparent;
            background: linear-gradient(white, white) padding-box,
            linear-gradient(135deg, #1d5501 0%, #18A999 100%) border-box;
        }

        .dark .border-gradient-primary {
            background: linear-gradient(#0f172a, #0f172a) padding-box,
            linear-gradient(135deg, #1d5501 0%, #18A999 100%) border-box;
        }

        .border-gradient-info {
            border: 2px solid transparent;
            background: linear-gradient(white, white) padding-box,
            linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%) border-box;
        }

        .dark .border-gradient-info {
            background: linear-gradient(#0f172a, #0f172a) padding-box,
            linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%) border-box;
        }

        /* NOUVEAU: Shadow gradients */
        .shadow-gradient-primary {
            box-shadow: 0 4px 14px 0 rgba(29, 85, 1, 0.2), 0 0 0 1px rgba(24, 169, 153, 0.1);
        }

        .shadow-gradient-info {
            box-shadow: 0 4px 14px 0 rgba(14, 165, 233, 0.2), 0 0 0 1px rgba(34, 211, 238, 0.1);
        }

        .shadow-gradient-success {
            box-shadow: 0 4px 14px 0 rgba(22, 163, 74, 0.2), 0 0 0 1px rgba(34, 197, 94, 0.1);
        }

        /* NOUVEAU: Animation gradients */
        @keyframes gradient-shift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .gradient-animated {
            background: linear-gradient(-45deg, #1d5501, #18A999, #F59E0B, #f97316);
            background-size: 400% 400%;
            animation: gradient-shift 8s ease infinite;
        }

        .gradient-animated-slow {
            background: linear-gradient(-45deg, #1d5501, #18A999, #F59E0B, #f97316);
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
        }

        /* NOUVEAU: Glass morphism */
        .glass-primary {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .dark .glass-primary {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-info {
            background: rgba(14, 165, 233, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        /* NOUVEAU: Section-specific gradients */
        .gradient-vaccination {
            background: linear-gradient(135deg, #1d5501 0%, #18A999 50%, #0ea5e9 100%);
        }

        .gradient-patient {
            background: linear-gradient(135deg, #8b5cf6 0%, #c084fc 50%, #ec4899 100%);
        }

        .gradient-stock {
            background: linear-gradient(135deg, #f59e0b 0%, #f97316 50%, #dc2626 100%);
        }

        .gradient-reporting {
            background: linear-gradient(135deg, #0d9488 0%, #14b8a6 50%, #22d3ee 100%);
        }

        .gradient-admin {
            background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 50%, #a78bfa 100%);
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-ivoireNight text-slate-900 dark:text-slate-100 antialiased">

<!-- Aura dégradée -->
<div class="pointer-events-none fixed inset-0 bg-[radial-gradient(circle_at_top,rgba(37,99,235,0.19),transparent_55%),radial-gradient(circle_at_bottom,rgba(16,185,129,0.16),transparent_55%)] opacity-70"></div>

<div class="relative min-h-screen flex flex-col">

    <!-- TOPBAR -->
    {% include "layout/_topbar.html" %}

    <!-- Layout principal -->
    <div class="flex-1 flex max-h-[calc(100vh-4rem)] overflow-hidden">
        <!-- SIDEBAR -->
        {#        {% block sidebar %}#}
        {% include "layout/_sidebar_admin.html" %}
        {#        {% endblock %}#}

        <!-- CONTENU PRINCIPAL -->
        <main class="flex-1 overflow-y-auto">
            <div class="max-w-7xl mx-auto px-4 lg:px-6 py-5 space-y-6">


                <!-- Contenu spécifique à chaque page -->
                {% block content %}

                {% endblock %}
            </div>
        </main>
    </div>

    <!-- Bottom bar mobile (optionnel) -->

    {% include "layout/_bottom.html" %}

</div>
<script>
    // Initialisation du store global
    document.addEventListener('alpine:init', () => {
        Alpine.store('app', window.vaccinationApp());
    });
</script>
</body>
</html>
